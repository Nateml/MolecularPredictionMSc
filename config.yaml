model:
  spectrum_length: 1000
  hidden_dims: [512, 256, 128]
  dropout: 0.3
  num_quantiles: 3
  regression_hidden_dim: 64

training:
  batch_size: 128
  num_epochs: 20
  learning_rate: 1e-3

data:
  #dataset_path: "src/data/MoNa/MoNA-filtered-curated-with-maccs-and-structure-onehot.json"
  #schema_path: "src/data/MoNa/feature_vector_onehot_schema.json"
  schema_path: "data/feature_vector_mixed_schema.json"
  dataset_path: "data/multitask_mlp_hardcoded.test.json"

checkpointing:
  save_dir: "models"

conformal:
  alpha: 0.1

solver:
  timeout: 30
  mem_limit: 512
